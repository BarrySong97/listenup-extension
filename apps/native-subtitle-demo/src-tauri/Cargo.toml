[package]
name = "listenup-native-subtitle-demo"
version = "0.1.0"
description = "ListenUp Native Messaging subtitle viewer demo"
authors = ["ListenUp"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "listenup_native_subtitle_demo"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
