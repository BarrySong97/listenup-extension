[package]
name = "listenup-desktop"
version = "0.1.0"
description = "ListenUp Desktop subtitle viewer"
authors = ["ListenUp"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "listenup_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon", "image-png"] }
window-vibrancy = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
