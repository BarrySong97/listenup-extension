[package]
name = "listenup-desktop"
version = "0.2.1"
description = "ListenUp Desktop subtitle viewer"
authors = ["ListenUp"]
edition = "2021"
rust-version = "1.77.2"
default-run = "listenup-desktop"

[lib]
name = "listenup_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
clap = { version = "4", features = ["derive"] }
language-tags = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["migrate", "runtime-tokio-rustls", "sqlite"] }
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
window-vibrancy = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
